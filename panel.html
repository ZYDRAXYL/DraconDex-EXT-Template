<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
<title>Template Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<!-- class="panel" is what app.js reads to decide it is in the DraconDex 5
     side panel rather than its own window: only the panel host answers
     panel.send/onMessage.
     No title bar and no close button here — the side panel draws its own
     header (the manifest's icon + title, and a ×). -->
<body class="panel">
  <div class="box context" id="context">Asking the host…</div>

  <h2>Add a note to this module</h2>
  <div class="row">
    <input id="title" type="text" placeholder="Title" maxlength="120">
    <button id="add">Add</button>
  </div>
  <textarea id="body" placeholder="Body (survives closing the panel)"></textarea>

  <h2 id="notes-heading">Notes</h2>
  <ul class="notes" id="notes"></ul>

  <div class="box status" id="status">Loading…</div>

  <script src="app.js"></script>
</body>
</html>
